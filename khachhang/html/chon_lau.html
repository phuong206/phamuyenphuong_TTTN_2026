<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            background: #020617;
            color: white;
            font-family: sans-serif;
            padding: 15px;
        }

        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .card {
            background: #1e293b;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.3s;
            border: 2px solid transparent;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card h3 {
            font-size: 14px;
            padding: 8px;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: #38bdf8;
        }

        input {
            display: none;
        }

        input:checked+.card {
            border-color: #38bdf8;
            box-shadow: 0 0 12px #38bdf8;
        }

        .btn {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: #38bdf8;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>Chọn Nước Lẩu</h2>

    <form action="../../pages/menu.php" method="GET">

        <div class="grid">

            <label>
                <input type="radio" name="lau" value="thai" required>
                <div class="card">
                    <img src="../../images/lau-thai-tomyum.jpg">
                    <h3>Lẩu Thái</h3>
                </div>
            </label>

            <label>
                <input type="radio" name="lau" value="kimchi">
                <div class="card">
                    <img src="../../images/lau-kim-chi.jpg">
                    <h3>Lẩu Kimchi</h3>
                </div>
            </label>

            <label>
                <input type="radio" name="lau" value="mala">
                <div class="card">
                    <img src="../../images/lau-mala.jpg">
                    <h3>Lẩu Mala</h3>
                </div>
            </label>

            <label>
                <input type="radio" name="lau" value="nam">
                <div class="card">
                    <img src="../../images/lau-nam.jpg">
                    <h3>Lẩu Nấm</h3>
                </div>
            </label>

            <label>
                <input type="radio" name="lau" value="2ngan">
                <div class="card">
                    <img src="../../images/lau-2-ngan.jpg">
                    <h3>Lẩu 2 Ngăn</h3>
                </div>
            </label>

        </div>

        <button class="btn">Vào Menu</button>

    </form>

</body>

</html>
